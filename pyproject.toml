[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hospital-agent"
version = "0.1.0"
description = "Hospital workstation agent for PACS, DICOM transfer, Yandex Cloud handoff, and operation reports."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34",
    "pydicom>=2.4",
    "pynetdicom>=2.0",
]

[project.scripts]
hospital-agent = "hospital_agent.app:main"

[tool.setuptools.packages.find]
include = ["hospital_agent*"]

[tool.ruff]
line-length = 100
target-version = "py310"
