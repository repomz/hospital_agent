[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hospital-agent"
version = "0.2.8"
description = "Hospital workstation agent for PACS, DICOM transfer, operation protocols, and hourly logs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "boto3>=1.34",
  "certifi>=2025.1.31",
  "pydicom>=2.4",
  "pynetdicom>=2.0",
  "python-dotenv>=1.0",
]

[project.scripts]
hospital-agent = "hospital_agent.app:main"

[project.optional-dependencies]
dev = ["ruff==0.16.9", "build>=1.2,<2"]

[tool.setuptools.packages.find]
include = ["hospital_agent*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
