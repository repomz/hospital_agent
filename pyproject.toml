[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hospital-agent-tools"
version = "0.1.0"
description = "Hospital workstation scripts for PACS, DICOM transfer, Yandex Cloud upload, and operation reports."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34",
    "httplib2>=0.22",
    "pydicom>=2.4",
    "pynetdicom>=2.0",
]

[project.scripts]
copy-month-operations = "scripts.copy1:main"
dicom-cli = "scripts.dicom_cli:main"
dicom-monitor = "scripts.dicom_monitor:main"
hospital-agent = "hospital_agent.app:main"
pacs-download = "scripts.pypacs_download:main"
pacs-to-yandex = "scripts.pacs_to_yandex:main"
report-operations = "scripts.report:main"
report-plan = "scripts.report_plan:main"
upload-to-yandex = "scripts.upload_to_yandex:main"

[tool.setuptools.packages.find]
include = ["hospital_agent*", "hospital_agent_tools*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py310"
